<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox</title>

    <style>

        * {
            margin: 0px;
            padding: 0px;
            box-sizing: border-box;
        }
        div.container {
            background-color: beige;

            height: 700px;
            width: 700px;
            
            display: flex;
            justify-content: center;
            align-items: center;

        }

        div.item {
            background-color: aquamarine;
            
            height: 100px;
            width: 100px;
            
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item">SEU ICONE DO INSTAGRAM</div>
    </div>
    
</body>
</html>

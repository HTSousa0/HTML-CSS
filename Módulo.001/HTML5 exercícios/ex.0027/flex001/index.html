<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex-box</title>

    <style>

        * {
            padding: 0px;
            margin: 0px;
        }
        div.container {
            
            background-color: rgb(0, 0, 0);
            display: flex;
            flex-direction: row;
            align-items:normal  ;
            justify-content: baseline;
            flex-wrap: wrap;
            
            height: 100vh;
            width: 100vw;

           
            border-radius: 10px;
            
            
        }

        div.item {  
            background-color: rgb(0, 0, 0);
            border:  1px solid rgb(255, 255, 255);
            text-align: center;
            font-size: 1.8em;
            color: rgb(255, 255, 255);
            padding: 10px;

            height: 80px;
            width: 200px;

            flex: auto;
           
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item">Exemplo de bloco:A</div>
        <div class="item">Exemplo de bloco:B</div>
        <div class="item">Exemplo de bloco:C</div>
        <div class="item">Exemplo de bloco:D</div>
        <div class="item">Exemplo de bloco:E</div>
        <div class="item">Exemplo de bloco:F</div>
        <div class="item">Exemplo de bloco:G</div>
        <div class="item">Exemplo de bloco:H</div>
        <div class="item">Exemplo de bloco:I</div>
    </div>


</body>
</html>
